<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Wadii Zouaghi - Cybersecurity student, CTF player and full-stack developer" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="ng" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff9c"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0.5"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#00ff9c" stroke-opacity="0.08"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#00ff9c" fill-opacity="0.06"/>
    </pattern>
    <clipPath id="c1"><rect x="30" y="55" height="40" width="0"><animate attributeName="width" from="0" to="130" dur="0.9s" begin="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="30" y="92" height="56" width="0"><animate attributeName="width" from="0" to="420" dur="1s" begin="1.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="30" y="150" height="30" width="0"><animate attributeName="width" from="0" to="780" dur="1.6s" begin="2.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="30" y="188" height="26" width="0"><animate attributeName="width" from="0" to="430" dur="1.3s" begin="4.1s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="900" height="260" rx="14" fill="url(#bg)"/>
  <rect width="900" height="260" rx="14" fill="url(#grid)"/>
  <rect width="900" height="260" rx="14" fill="url(#scan)"/>
  <rect x="1" y="1" width="898" height="258" rx="13" fill="none" stroke="url(#bd)" stroke-width="1.5"/>

  <circle cx="30" cy="28" r="5" fill="#ff5f56"/>
  <circle cx="50" cy="28" r="5" fill="#ffbd2e"/>
  <circle cx="70" cy="28" r="5" fill="#27c93f"/>
  <text x="450" y="32" fill="#8b949e" font-size="12" text-anchor="middle">wadii@ctf: ~</text>

  <text x="590" y="72" fill="#8b949e" font-size="13" fill-opacity="0.7">$ echo -n WADII | xxd</text>
  <text x="590" y="92" fill="#00ff9c" font-size="13" fill-opacity="0.55">00000000: 5741 4449 49    WADII</text>

  <g clip-path="url(#c1)"><text x="40" y="82" fill="#00ff9c" font-size="20">$ whoami</text></g>
  <g clip-path="url(#c2)"><text x="40" y="135" fill="url(#ng)" font-size="46" font-weight="700">Wadii Zouaghi</text></g>
  <g clip-path="url(#c3)"><text x="40" y="170" fill="#58a6ff" font-size="20">&gt; Cybersecurity student · CTF player · Full-stack developer</text></g>
  <g clip-path="url(#c4)"><text x="40" y="205" fill="#8b949e" font-size="14">flag{curiosity_is_the_only_exploit_you_need}</text></g>

  <rect x="418" y="193" width="9" height="15" fill="#00ff9c" opacity="0">
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="5.4s" repeatCount="indefinite"/>
  </rect>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
